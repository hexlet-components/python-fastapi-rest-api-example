name: Contract Tests

# Отдельным workflow, а не шагом в основном: проверка идёт снаружи, по
# спеке, и выкинуть её должно быть просто — удалением одного файла и цели
# contract-test в Makefile.
#
# Ловит то, чего не видят ни тесты, ни проверка запросов: применена ли
# авторизация, не отдаёт ли API статусы, которых нет в контракте, и не
# падает ли он в 5xx на краевых входах. Все три вида находок здесь уже
# были, и все три исправлены.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Install
        run: make install

      - name: Run contract tests
        run: make contract-test
