name: Release Please

# Вторая половина того, что требует pr-title.yml: заголовок в виде
# conventional commit нужен именно затем, чтобы по нему определялся
# разряд версии. Без этого workflow заголовки проверялись бы, ничего не
# выпуская.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
