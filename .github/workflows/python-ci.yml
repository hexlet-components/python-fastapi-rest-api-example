name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

# Пуш в ветку с открытым PR запускает проверки дважды. Прошлый прогон
# отменяется, кроме main: там история прогонов нужна целиком.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-python не нужен: версию питона держит .python-version, и uv
      # сам ставит её при первом uv sync.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      # Модели порождены контрактом, поэтому расхождение с закоммиченными
      # значит, что контракт правили без перегенерации — и код опирается
      # на схему, которой в спеке уже нет.
      - name: Check the generated code
        run: make generate-check
      # Схема без миграции — молчаливая поломка: код ждёт колонку,
      # которой в базе не появится.
      - name: Check migrations
        run: make migration-check
      - name: Run tests
        run: make test-coverage
