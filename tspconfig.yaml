# Спека кладётся в openapi/ и коммитится: по ней генерируются модели,
# её же отдаёт приложение на /openapi.json, и по ней идут контрактные
# тесты.
emit:
  - "@typespec/openapi3"

options:
  "@typespec/openapi3":
    file-type: json
    emitter-output-dir: "{project-root}/openapi"
    output-file: "openapi.{version}.json"
