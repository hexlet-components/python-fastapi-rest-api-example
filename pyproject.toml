[project]
name = "python-fastapi-rest-api-example"
version = "0.1.0"
description = "REST API на FastAPI: схема из кода, SQLAlchemy и Alembic, проверка спеки снаружи"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "secure>=2.0.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.47",
]

[dependency-groups]
dev = [
    "faker>=40.40.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "schemathesis>=4.28.0",
]

[tool.ruff]
line-length = 80
# Сгенерированное из контракта руками не правится, поэтому и стиль его
# не обсуждается: генератор печатает в своём.
extend-exclude = ["app/types/handlers"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
