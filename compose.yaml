# Локальный запуск собранного образа. Базы отдельным сервисом нет: по
# умолчанию она живёт в памяти процесса и пересоздаётся при каждом
# старте. Для постоянного хранения задаётся DATABASE_URL.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Значение только для локального запуска — оно лежит в публичном
      # репозитории. В бою секрет приходит из окружения.
      JWT_SECRET: dev-only-secret-do-not-use-in-production
      ENVIRONMENT: production
    healthcheck:
      # Тот же /health, что опрашивает оркестратор. Ни curl, ни wget в
      # slim-образе нет, поэтому проверка идёт питоном.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(
              0
              if urllib.request.urlopen(
                  "http://127.0.0.1:8000/health", timeout=3
              ).status == 200
              else 1
          )
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
